    <rect x="0" y="0" width="410" height="72" rx="6" fill="#1B1B22" stroke="#3A3A44" stroke-width="2"/>
    <rect x="16" y="8" width="378" height="8" rx="2" fill="#FC0203"/>
    <rect x="24" y="28" width="70" height="26" rx="3" fill="#292932"/>
    <rect x="110" y="28" width="70" height="26" rx="3" fill="#292932"/>
    <rect x="196" y="28" width="70" height="26" rx="3" fill="#292932"/>
    <rect x="282" y="28" width="100" height="26" rx="3" fill="#292932"/>
    <rect x="12" y="72" width="386" height="8" fill="#EAB308"/>
  </g>
