<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#0A0A0C"/>
  <g opacity="0.15" stroke="#FC0203" stroke-width="2">
    <line x1="80" y1="600" x2="340" y2="0"/>
    <line x1="120" y1="600" x2="380" y2="0"/>
  </g>
  <!-- NVMe SSD -->
  <g transform="translate(150 155) rotate(-8)">
    <rect x="0" y="0" width="380" height="105" rx="6" fill="#18181D" stroke="#FC0203" stroke-width="2.5"/>
    <rect x="38" y="18" width="110" height="68" rx="4" fill="#26262E"/>
    <rect x="165" y="18" width="95" height="68" rx="4" fill="#101014" stroke="#3F3F46"/>
